name: Build

# Tests, then Android and iOS release builds. The iOS job runs on a hosted
# macOS runner, so no Mac is needed. The builds read the backend's URL from
# the API_BASE_URL repository variable (Settings -> Secrets and variables ->
# Actions -> Variables); the app has no built-in server address.
#
# The builds are not signed for the stores yet: Android release artifacts
# carry Flutter's debug key and the iOS build is unsigned. Store signing is
# added once the publishing accounts' credentials are available as secrets.

on:
  push:
    branches: [main, flutter]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.5 # keep in step with tool/flutter.Dockerfile
  API_BASE_URL: ${{ vars.API_BASE_URL }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require API_BASE_URL
        run: test -n "$API_BASE_URL" || { echo "::error::Set the API_BASE_URL repository variable"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
      - run: flutter build appbundle --release --dart-define=API_BASE_URL="$API_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  ios:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Require API_BASE_URL
        run: test -n "$API_BASE_URL" || { echo "::error::Set the API_BASE_URL repository variable"; exit 1; }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: Package the app
        run: cd build/ios/iphoneos && zip -qr Runner.app.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: build/ios/iphoneos/Runner.app.zip
